[[mods]]
modId="mcopt_metal"
version="${version}"
displayName="Metal Shaders"
authors="Noah Dunnagan, Gael Quintanilla"
description='''
Native Apple Metal rendering backend with native shaders for Minecraft on Apple Silicon.
'''

[[mixins]]
config="mcopt-metal.mixins.json"
[[mixins]]
config="mcopt-metal-lod.mixins.json"
[[mixins]]
config="mcopt-metal-gen.mixins.json"
[[mixins]]
