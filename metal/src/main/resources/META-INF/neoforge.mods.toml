ordering="NONE"
side="CLIENT"

[[dependencies.mcopt_metal]]
modId="embeddium"
type="incompatible"
versionRange="[0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.mcopt_metal]]
modId="sodium"
