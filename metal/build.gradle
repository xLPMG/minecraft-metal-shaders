plugins {
	id 'net.neoforged.moddev'
}

version = '2.0.1-alpha'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
	maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

def mixinRefmapFile = layout.buildDirectory.file('mixin/mcopt_metal.refmap.json')

dependencies {
	annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

neoForge {
	version = neoforge_version

	runs {
		client {
			client()
		}
	}

	mods {
		"mcopt_metal" {
			sourceSet sourceSets.main
		}
	}
}

def nativeOut = layout.buildDirectory.dir('natives/natives')

tasks.register('compileNative', Exec) {
	def sources = ['mcmetal.m', 'mclod.m', 'lodseam.m', 'lodmesh.c', 'lodnoise.c', 'rec.m', 'mcown.m', 'mccap.m', 'mcshade.m', 'mcshadow.m', 'mcwater.m', 'mcvl.m', 'mctaa.m', 'mcdynlight.m', 'mcxdr.m', 'mcclouds.m', 'mccompile.m'].collect { file("src/main/native/$it") }
	def output = nativeOut.get().file('libmcmetal.dylib').asFile
	inputs.files sources, file('src/main/native/mcmetal.h'), file('src/main/native/lodmesh.h')
	outputs.file output
	doFirst { output.parentFile.mkdirs() }
	commandLine(['clang', '-fno-objc-arc', '-O2', '-Wall', '-arch', 'arm64', '-mmacosx-version-min=15.0', '-dynamiclib', '-install_name', '@rpath/libmcmetal.dylib',
		'-framework', 'AppKit', '-framework', 'CoreGraphics', '-framework', 'CoreVideo', '-framework', 'Foundation', '-framework', 'Metal', '-framework', 'QuartzCore', '-o', output] + sources)
}

processResources {
	dependsOn 'compileNative'
	from(layout.buildDirectory.dir('natives'))
	inputs.properties([
		version: version,
		minecraft_version: minecraft_version,
		neoforge_version: neoforge_version
	])
	filesMatching('META-INF/neoforge.mods.toml') {
		expand(
			version: version,
			minecraft_version_range: "[${minecraft_version}]",
			neoforge_version_range: "[${neoforge_version},)"
		)
	}
}

// Double-clicking the jar (java -jar) explains that it's a Fabric mod and how to install it.
jar {
	manifest { attributes 'Main-Class': 'mcopt.metal.InstallHelp', 'Implementation-Version': version }
	// Apache-2.0 asks for LICENSE and NOTICE in every copy; LICENSES/ holds the other licences NOTICE refers to.
	from(rootProject.file('LICENSE'))
	from(rootProject.file('NOTICE'))
	from(rootProject.file('LICENSES')) { into 'LICENSES' }
	from(mixinRefmapFile)
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	if (it.name == 'compileJava') {
		it.options.compilerArgs += ["-AoutRefMapFile=${mixinRefmapFile.get().asFile.absolutePath}"]
		it.outputs.file(mixinRefmapFile)
	}
	// the far terrain's Vector API noise control (LodNoiseVector, opt-in -Dmcopt.lod.nativeNoise=vector): loaded only when the game runs with
	// --add-modules jdk.incubator.vector
	if (it.name == 'compileJava') it.options.compilerArgs += ['--add-modules', 'jdk.incubator.vector']
}
