plugins {
	id 'net.neoforged.moddev'
}

version = '0.3.0-alpha.2'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
	maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

def mixinRefmapFile = layout.buildDirectory.file('mixin/mcopt_fps.refmap.json')

dependencies {
	annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

neoForge {
	version = neoforge_version

	runs {
		client {
			client()
		}
	}

	mods {
		"mcopt_fps" {
			sourceSet sourceSets.main
		}
	}
}

processResources {
	inputs.properties([
		version: version,
		minecraft_version: minecraft_version,
		neoforge_version: neoforge_version
	])
	filesMatching('META-INF/neoforge.mods.toml') {
		expand(
			version: version,
			minecraft_version_range: "[${minecraft_version}]",
			neoforge_version_range: "[${neoforge_version},)"
		)
	}
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

tasks.named('compileJava', JavaCompile).configure {
	options.compilerArgs += ["-AoutRefMapFile=${mixinRefmapFile.get().asFile.absolutePath}"]
	outputs.file(mixinRefmapFile)
}

// Apache-2.0 asks for LICENSE and NOTICE in every copy.
jar {
	from(rootProject.file('LICENSE'))
	from(rootProject.file('NOTICE'))
	from(mixinRefmapFile)
}
